name: Flutter Full Multi-Platform Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      windows-only:
        description: "Build Windows x64 only (Fast)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-flutter-nightly-build:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      windows-only: ${{ inputs.windows-only || false }}
